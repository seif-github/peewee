name: "Tests"

on:
  push:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.11"
          - "3.13"
          - "3.14-dev"
        backend:
          - sqlite
          - postgresql
          - mysql
        include:
          - python-version: "3.8"
            backend: sqlite
          - python-version: "3.8"
            backend: postgresql
          - python-version: "3.8"
            backend: mysql
          - python-version: "3.12"
            backend: sqlite
          - python-version: "3.12"
            backend: postgresql
          - python-version: "3.12"
            backend: psycopg3
          - python-version: "3.12"
            backend: cysqlite
          - python-version: "3.12"
            backend: cockroachdb
          - python-version: "3.9"
            backend: psycopg3
          - python-version: "3.11"
            backend: psycopg3
          - python-version: "3.13"
            backend: psycopg3
          - python-version: "3.14-dev"
            backend: psycopg3
          - python-version: "3.9"
            backend: cysqlite
          - python-version: "3.11"
            backend: cysqlite
          - python-version: "3.13"
            backend: cysqlite
          - python-version: "3.14-dev"
            backend: cysqlite
          - python-version: "3.9"
            backend: cockroachdb
          - python-version: "3.11"
            backend: cockroachdb
          - python-version: "3.13"
            backend: cockroachdb
          - python-version: "3.14-dev"
            backend: cockroachdb
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: peewee
          POSTGRES_DB: peewee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mariadb:
        image: mariadb:latest
        env:
          MARIADB_ROOT_PASSWORD: peewee
          MARIADB_DATABASE: peewee_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev postgresql-client mysql-client
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools psycopg2-binary "psycopg[binary]" cython pymysql apsw pydantic
      - name: Install cysqlite for cysqlite/sqlite backends
        if: matrix.backend == 'cysqlite' || matrix.backend == 'sqlite'
        run: pip install git+https://github.com/coleifer/cysqlite.git
      - name: Build extension modules
        run: python setup.py build_ext -i
      - name: Initialize PostgreSQL hstore extension
        run: PGPASSWORD=peewee psql -h localhost -U postgres -d peewee_test -c "CREATE EXTENSION IF NOT EXISTS hstore;"
      - name: Set up CockroachDB for cockroachdb backend
        if: matrix.backend == 'cockroachdb'
        run: |
          curl -sOL https://binaries.cockroachdb.com/cockroach-v23.1.11.linux-amd64.tgz
          tar -xzf cockroach-v23.1.11.linux-amd64.tgz
          sudo mv cockroach-v23.1.11.linux-amd64/cockroach /usr/local/bin/
          cockroach start-single-node --insecure --advertise-addr=localhost &
          sleep 10
          cockroach sql --insecure -e "CREATE DATABASE IF NOT EXISTS peewee_test;"
      - name: Run Peewee test suite
        env:
          CI: "1"
        run: |
          python runtests.py \
            --engine="${{ matrix.backend }}" \
            --mysql-host=127.0.0.1 \
            --mysql-port=3306 \
            --mysql-user=root \
            --mysql-password=peewee \
            --psql-host=localhost \
            --psql-port=5432 \
            --psql-user=postgres \
            --psql-password=peewee