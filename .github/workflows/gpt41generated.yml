"name": "Tests"
"on":
  "push":
    "branches":
      - "**"

"concurrency":
  "group": "tests-${{ github.ref }}"
  "cancel-in-progress": true

"jobs":
  "tests":
    "name": "Tests (Python ${{ matrix.python-version }}, backend=${{ matrix.backend }})"
    "runs-on": "ubuntu-latest"
    "timeout-minutes": 15
    "strategy":
      "fail-fast": false
      "matrix":
        "python-version": ["3.9", "3.11", "3.13", "3.14"]
        "backend": ["sqlite", "postgresql", "mysql"]
        "include":
          - "python-version": "3.8"
            "backend": "sqlite"
          - "python-version": "3.12"
            "backend": "postgresql"
          - "python-version": "3.12"
            "backend": "psycopg3"
          - "python-version": "3.12"
            "backend": "cysqlite"
          - "python-version": "3.12"
            "backend": "cockroachdb"
    "services":
      "mariadb":
        "image": "mariadb:latest"
        "env":
          "MYSQL_ROOT_PASSWORD": "peewee"
          "MYSQL_DATABASE": "peewee_test"
        "ports":
          - "3306:3306"
        "options": "--health-cmd=\"mariadb-admin ping -h localhost -u root -ppeewee --silent\" --health-interval=10s --health-timeout=5s --health-retries=5"
      "postgres":
        "image": "postgres:latest"
        "env":
          "POSTGRES_USER": "postgres"
          "POSTGRES_PASSWORD": "peewee"
          "POSTGRES_DB": "peewee_test"
        "ports":
          - "5432:5432"
        "options": "--health-cmd=\"pg_isready -U postgres\" --health-interval=10s --health-timeout=5s --health-retries=5"
    "steps":
      - "name": "Checkout code"
        "uses": "actions/checkout@v4"

      - "name": "Set up Python"
        "uses": "actions/setup-python@v5"
        "with":
          "python-version": "${{ matrix.python-version }}"

      - "name": "Install system dependencies"
        "run": "sudo apt-get update && sudo apt-get install -y libsqlite3-dev"

      - "name": "Set up pip cache"
        "uses": "actions/cache@v4"
        "with":
          "path": "~/.cache/pip"
          "key": "${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}"
          "restore-keys": |
            "${{ runner.os }}-pip-"

      - "name": "Install Python dependencies"
        "run": |
          python -m pip install --upgrade pip
          python -m pip install setuptools psycopg2-binary "psycopg[binary]" cython pymysql apsw pydantic

      - "name": "Install cysqlite for sqlite backends"
        "if": "matrix.backend == 'sqlite' || matrix.backend == 'cysqlite'"
        "run": |
          python -m pip install git+https://github.com/coleifer/cysqlite.git

      - "name": "Build extensions"
        "run": "python setup.py build_ext -i"

      - "name": "Initialize Postgres hstore extension"
        "run": |
          psql postgresql://postgres:peewee@localhost:5432/peewee_test -c "CREATE EXTENSION IF NOT EXISTS hstore;"

      - "name": "Set up CockroachDB for cockroachdb backend"
        "if": "matrix.backend == 'cockroachdb'"
        "run": |
          curl https://binaries.cockroachdb.com/cockroach-v24.1.0.linux-amd64.tgz -o cockroach.tgz
          tar xzf cockroach.tgz
          sudo mv cockroach-v24.1.0.linux-amd64/cockroach /usr/local/bin/
          cockroach start-single-node --insecure --listen-addr=localhost:26257 --http-addr=localhost:8080 &
          sleep 15
          cockroach sql --insecure --host=localhost:26257 -e "CREATE DATABASE IF NOT EXISTS peewee_test;"

      - "name": "Run tests"
        "env":
          "PEEWEE_TEST_BACKEND": "${{ matrix.backend }}"
          "PEEWEE_TEST_POSTGRESQL_USER": "postgres"
          "PEEWEE_TEST_POSTGRESQL_PASS": "peewee"
          "PEEWEE_TEST_POSTGRESQL_DB": "peewee_test"
          "PEEWEE_TEST_POSTGRESQL_HOST": "localhost"
          "PEEWEE_TEST_POSTGRESQL_PORT": "5432"
          "CI": "1"
        "run": |
          python runtests.py --mysql-host=127.0.0.1 --mysql-port=3306 --mysql-user=root --mysql-password=peewee

      - "name": "Upload test logs on failure"
        "if": "failure()"
        "uses": "actions/upload-artifact@v4"
        "with":
          "name": "test-logs-${{ matrix.python-version }}-${{ matrix.backend }}"
          "path": "tests/*.log"