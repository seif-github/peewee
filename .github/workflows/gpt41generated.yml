name: Tests (GPT-4.1 Generated)

on:
  push:
    branches:
      - "**"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }}, backend=${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
        backend: ["sqlite", "postgresql", "mysql"]
        include:
          - python-version: "3.8"
            backend: "sqlite"
          - python-version: "3.12"
            backend: "psycopg3"
          - python-version: "3.12"
            backend: "cysqlite"
          - python-version: "3.12"
            backend: "cockroachdb"

    services:
      services:
      mariadb:
        image: mariadb:latest
        env:
          MARIADB_ROOT_PASSWORD: peewee
          MARIADB_DATABASE: peewee
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=5

      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: peewee
          POSTGRES_DB: peewee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d peewee_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev postgresql-client

      - name: Set up pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.backend }}-${{ hashFiles('**/requirements*.txt', 'setup.py', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.backend }}-
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install psycopg2-binary pymysql apsw cython pydantic

      - name: Install cysqlite for sqlite backends
        if: matrix.backend == 'sqlite' || matrix.backend == 'cysqlite'
        run: |
          python -m pip install git+https://github.com/coleifer/cysqlite.git

      - name: Build extensions
        run: python setup.py build_ext -i

      - name: Initialize Postgres hstore extension
        if: matrix.backend == 'postgresql' || matrix.backend == 'psycopg3'
        env:
          PGPASSWORD: peewee
        run: |
          psql -h localhost -U postgres -d peewee_test -c "CREATE EXTENSION IF NOT EXISTS hstore;"

      - name: Set up CockroachDB for cockroachdb backend
        if: matrix.backend == 'cockroachdb'
        run: |
          curl -fsSL https://binaries.cockroachdb.com/cockroach-v24.1.0.linux-amd64.tgz -o cockroach.tgz
          tar xzf cockroach.tgz
          sudo mv cockroach-v24.1.0.linux-amd64/cockroach /usr/local/bin/
          cockroach start-single-node --insecure --listen-addr=localhost:26257 --http-addr=localhost:8080 &
          sleep 15
          cockroach sql --insecure --host=localhost:26257 -e "CREATE DATABASE IF NOT EXISTS peewee_test;"

      - name: Run tests
        env:
          PEEWEE_TEST_BACKEND: ${{ matrix.backend }}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: peewee
          POSTGRES_DB: peewee_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          CI: "1"
        run: |
          python runtests.py --mysql-host=127.0.0.1 --mysql-port=3306 --mysql-user=root --mysql-password=peewee

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.python-version }}-${{ matrix.backend }}
          path: tests/*.log