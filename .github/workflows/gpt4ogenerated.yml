name: "Tests"

on:
  push:
    branches:
      - "**"

concurrency:
  group: "tests-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  tests:
    name: "Tests (Python ${{ matrix.python-version }}, backend=${{ matrix.backend }})"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15

    services:
      mariadb:
        image: "mariadb:latest"
        env:
          MARIADB_ROOT_PASSWORD: "peewee"
          MARIADB_DATABASE: "peewee"
        ports:
          - "3306:3306"
        options: "--health-cmd=\"mysqladmin ping -h 127.0.0.1 -u root -ppeewee\" --health-interval=10s --health-timeout=5s --health-retries=5"

      postgres:
        image: "postgres:latest"
        env:
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "peewee"
          POSTGRES_DB: "peewee_test"
        ports:
          - "5432:5432"
        options: "--health-cmd=\"pg_isready -U postgres\" --health-interval=10s --health-timeout=5s --health-retries=5"

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13", "3.14"]
        backend: ["sqlite", "postgresql", "mysql"]
        include:
          - python-version: "3.8"
            backend: "sqlite"
          - python-version: "3.12"
            backend: "sqlite"
          - python-version: "3.12"
            backend: "psycopg3"
          - python-version: "3.12"
            backend: "cysqlite"
          - python-version: "3.12"
            backend: "cockroachdb"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v4"

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: "actions/setup-python@v5"
        with:
          python-version: "${{ matrix.python-version }}"

      - name: "Install system dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: "Set up pip cache"
        uses: "actions/cache@v4"
        with:
          path: |
            ~/.cache/pip
          key: "${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}-${{ matrix.python-version }}"
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: "Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            psycopg2-binary \
            "psycopg[binary]" \
            cython \
            pymysql \
            apsw \
            pydantic

      - name: "Build extensions"
        run: |
          python setup.py build_ext -i

      - name: "Initialize Postgres hstore extension"
        env:
          PGPASSWORD: "peewee"
        run: |
          psql -h 127.0.0.1 -U postgres -d peewee_test -c "CREATE EXTENSION IF NOT EXISTS hstore;"

      - name: "Set up CockroachDB (cockroachdb backend only)"
        if: "${{ matrix.backend == 'cockroachdb' }}"
        run: |
          curl https://binaries.cockroachdb.com/cockroach-v23.1.0.linux-amd64.tgz -o cockroach.tgz
          tar xzf cockroach.tgz
          sudo mv cockroach-v23.1.0.linux-amd64/cockroach /usr/local/bin/
          cockroach start-single-node --insecure --listen-addr=127.0.0.1:26257 --http-addr=127.0.0.1:8080 --background
          cockroach sql --insecure --host=127.0.0.1:26257 -e "CREATE DATABASE IF NOT EXISTS peewee_test;"

      - name: "Install cysqlite for sqlite-like backends"
        if: "${{ matrix.backend == 'cysqlite' || matrix.backend == 'sqlite' }}"
        run: |
          python -m pip install git+https://github.com/coleifer/cysqlite.git

      - name: "Run tests"
        env:
          PEEWEE_TEST_BACKEND: "${{ matrix.backend }}"
          PEEWEE_TEST_POSTGRESQL_DB: "peewee_test"
          PEEWEE_TEST_POSTGRESQL_USER: "postgres"
          PEEWEE_TEST_POSTGRESQL_PASS: "peewee"
          PEEWEE_TEST_POSTGRESQL_HOST: "127.0.0.1"
          PEEWEE_TEST_POSTGRESQL_PORT: "5432"
          CI: "1"
        run: |
          python runtests.py \
            --engine="${{ matrix.backend }}" \
            --mysql-host=127.0.0.1 \
            --mysql-port=3306 \
            --mysql-user=root \
            --mysql-password=peewee