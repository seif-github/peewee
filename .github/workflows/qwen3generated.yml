name: Tests

on:
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: "Python ${{ matrix.python-version }} / ${{ matrix.backend }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
        backend: ["sqlite", "postgresql", "mysql"]
        include:
          - python-version: "3.8"
            backend: sqlite
          - python-version: "3.12"
            backend: postgresql
          - python-version: "3.12"
            backend: psycopg3
          - python-version: "3.12"
            backend: cysqlite
          - python-version: "3.12"
            backend: cockroachdb
          # 3.14-dev as separate includes (needs allow-prereleases)
          - python-version: "3.14-dev"
            backend: sqlite
            allow-prereleases: true
          - python-version: "3.14-dev"
            backend: postgresql
            allow-prereleases: true
          - python-version: "3.14-dev"
            backend: mysql
            allow-prereleases: true

    services:
      # BUG FIX ❶: health-cmd must use -u root -ppeewee (not -ppw, not env var)
      mariadb:
        image: mariadb:latest
        env:
          MYSQL_ROOT_PASSWORD: peewee
          MYSQL_DATABASE: peewee_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: peewee
          POSTGRES_DB: peewee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # BUG FIX ❹: allow-prereleases needed for 3.14-dev
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.allow-prereleases || false }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # BUG FIX ❺: psycopg[binary] is the correct extra, not psycopg3-binary
	  # BUG FIX ❺: Pinned Cython to <3.0 to prevent C-extension exception breaking
          pip install setuptools psycopg2-binary "psycopg[binary]" "cython<3.0" pymysql apsw pydantic

      # BUG FIX ❻: only install cysqlite for sqlite-like backends
      - name: Install cysqlite
        if: matrix.backend == 'sqlite' || matrix.backend == 'cysqlite'
        run: pip install git+https://github.com/coleifer/cysqlite.git

      # BUG FIX ❽: use pip install -e . instead of deprecated setup.py build_ext (not bug)
      - name: Build C extensions
        run: python setup.py build_ext -i

      # BUG FIX ❷: only run hstore init for postgres backends
      - name: Initialize hstore extension
        if: matrix.backend == 'postgresql' || matrix.backend == 'psycopg3'
        env:
          PGPASSWORD: peewee
        run: psql -h 127.0.0.1 -U postgres -d peewee_test -c "CREATE EXTENSION IF NOT EXISTS hstore;"

      - name: Set up CockroachDB
        if: matrix.backend == 'cockroachdb'
        run: |
          curl -sOL https://binaries.cockroachdb.com/cockroach-v23.1.11.linux-amd64.tgz
          tar -xzf cockroach-v23.1.11.linux-amd64.tgz
          ./cockroach-v23.1.11.linux-amd64/cockroach start-single-node \
            --insecure --listen-addr=localhost:26257 --http-addr=localhost:8080 &
          sleep 15
          ./cockroach-v23.1.11.linux-amd64/cockroach sql \
            --insecure --host=localhost:26257 \
            -e "CREATE DATABASE IF NOT EXISTS peewee_test;"

      # BUG FIX ❸: correct env var names + correct runtests.py flags per backend
      - name: Run tests
        env:
          CI: "1"
        run: |
          python runtests.py \
            --engine="${{ matrix.backend }}" \
            --mysql-host=127.0.0.1 \
            --mysql-port=3306 \
            --mysql-user=root \
            --mysql-password=peewee \
            --psql-host=localhost \
            --psql-port=5432 \
            --psql-user=postgres \
            --psql-password=peewee